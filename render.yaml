services:
  - type: web
    name: crypto-radar-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCAN_INTERVAL_MINUTES
        value: 5
      - key: MIN_ALERT_SCORE
        value: 70
      - key: MIN_LIQUIDITY_USD
        value: 50000
      - key: MIN_VOLUME_24H_USD
        value: 100000

  - type: static
    name: crypto-radar-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
